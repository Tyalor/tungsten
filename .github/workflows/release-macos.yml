name: Release macOS

# Builds the Apple Silicon app on a version tag and attaches a DMG to a
# GitHub Release. When Developer ID secrets are present the bundle is signed
# with the hardened runtime, notarized and stapled; otherwise it is ad-hoc
# signed exactly like the CI build and users need "Open Anyway" once.
#
# Secrets (all optional, all required together for notarization):
#   MACOS_CERTIFICATE_P12      base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD password of that .p12
#   MACOS_SIGNING_IDENTITY     e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                   Apple ID used for notarytool
#   APPLE_TEAM_ID              10-character team id
#   APPLE_APP_PASSWORD         app-specific password for that Apple ID

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build, sign, notarize
    runs-on: macos-26
    env:
      APP_NAME: Xenia-edge
      DMG_NAME: xenia_silicon_macos_arm64.dmg
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache Slang
        id: cache-slang
        uses: actions/cache@v5
        with:
          path: .slang
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Download Slang
        if: steps.cache-slang.outputs.cache-hit != 'true'
        run: ./xenia-build.py slang

      - name: Cache Metal Shader Converter
        id: cache-msc
        uses: actions/cache@v5
        with:
          path: .metal-shader-converter
          key: ${{ runner.os }}-metal-shader-converter-4.0-beta2

      - name: Download Metal Shader Converter
        if: steps.cache-msc.outputs.cache-hit != 'true'
        run: ./xenia-build.py msc

      - name: Submodules and data
        run: |
          git submodule update --init --depth=1 -j$(sysctl -n hw.ncpu) \
            $(grep -oE 'path = .+' .gitmodules | sed 's/path = //' \
              | grep -v 'DirectXShaderCompiler')
          git submodule update --init --recursive --depth=1 \
            -j$(sysctl -n hw.ncpu) third_party/wxWidgets
          ./xenia-build.py fetchdata

      - name: Set up Python for Meson
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Meson for spirv_to_dxil
        run: python3 -m pip install --upgrade meson mako pyyaml packaging

      - name: Install Metal Toolchain
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo xcodebuild -downloadComponent MetalToolchain; then
              exit 0
            fi
            [ $attempt -lt 5 ] && sleep $((attempt * 30))
          done
          echo "::error::MetalToolchain download failed"
          exit 1

      - name: Build
        run: ./xenia-build.py build --config=Release --target=xenia-app

      - name: Verify bundle
        run: |
          app="build/bin/macOS/Release/${APP_NAME}.app"
          test -d "$app"
          file "$app/Contents/MacOS/${APP_NAME}" | grep -q arm64
          codesign -d --entitlements - "$app" 2>&1 | tee entitlements.txt
          if grep -q get-task-allow entitlements.txt; then
            echo "::error::Release bundle carries get-task-allow"
            exit 1
          fi

      - name: Import Developer ID certificate
        id: cert
        if: ${{ env.P12 != '' }}
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Sign with Developer ID
        if: steps.cert.outputs.signed == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app="build/bin/macOS/Release/${APP_NAME}.app"
          # Nested dylibs first, then the bundle, each with the hardened runtime.
          find "$app/Contents/Frameworks" -name '*.dylib' -print0 2>/dev/null \
            | xargs -0 -n1 -I{} codesign --force --options runtime \
                --timestamp --sign "$IDENTITY" "{}"
          codesign --force --options runtime --timestamp \
            --entitlements xenia.entitlements --sign "$IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Notarize and staple
        if: steps.cert.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          app="build/bin/macOS/Release/${APP_NAME}.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Package DMG
        run: |
          set -euo pipefail
          app="build/bin/macOS/Release/${APP_NAME}.app"
          mkdir -p dmg_contents artifacts
          cp -R "$app" dmg_contents/
          cp LICENSE THIRD_PARTY_NOTICES.md dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "Xenia Silicon" -srcfolder dmg_contents \
            -ov -format UDZO "artifacts/${DMG_NAME}"
          if [ "${{ steps.cert.outputs.signed }}" = "true" ]; then
            codesign --force --timestamp \
              --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" "artifacts/${DMG_NAME}"
            xcrun notarytool submit "artifacts/${DMG_NAME}" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.APPLE_APP_PASSWORD }}" --wait
            xcrun stapler staple "artifacts/${DMG_NAME}"
          fi
          shasum -a 256 "artifacts/${DMG_NAME}" > "artifacts/${DMG_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xenia_silicon_macos_arm64
          path: artifacts
          if-no-files-found: error

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo "Apple Silicon build of Xenia Silicon at ${GITHUB_SHA::9}."
            echo
            if [ "${{ steps.cert.outputs.signed }}" = "true" ]; then
              echo "Signed with Developer ID and notarized. Drag the app to Applications and open it."
            else
              echo "Ad-hoc signed, not notarized. After the first launch is refused, open"
              echo "System Settings > Privacy & Security and click Open Anyway, then launch again."
            fi
            echo
            echo "No games, keys or system files are included. See CHANGELOG.md for what this fork changes."
          } > release_notes.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "Xenia Silicon ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md --prerelease
